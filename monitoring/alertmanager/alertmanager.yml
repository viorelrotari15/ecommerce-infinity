global:
  resolve_timeout: 5m
  smtp_smarthost: ${SMTP_HOST:-smtp.example.com}:${SMTP_PORT:-587}
  smtp_from: ${SMTP_FROM:-alerts@example.com}
  smtp_auth_username: ${SMTP_USERNAME:-smtp-user}
  smtp_auth_password: ${SMTP_PASSWORD:-smtp-password}

route:
  receiver: "default"
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  - name: "default"
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/T000/B000/XXXX}
        channel: ${SLACK_CHANNEL:-#alerts}
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }} - {{ .Annotations.description }}\n{{ end }}"
    email_configs:
      - to: ${ALERT_EMAIL_TO:-oncall@example.com}
        send_resolved: true
