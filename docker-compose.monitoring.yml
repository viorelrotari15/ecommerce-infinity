# Optional: run with main stack to get metrics + logs in Grafana.
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
# Grafana: http://localhost:3002 (default admin/admin). Add Loki datasource for logs.
# On Linux, Promtail reads Docker container logs from /var/lib/docker/containers.
# On Docker Desktop (Mac/Windows), that path may not be available; use admin logs or save-log script for logs.

version: '3.8'

services:
  loki:
    image: grafana/loki:2.9.3
    container_name: ecommerce-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - ecommerce-network

  promtail:
    image: grafana/promtail:2.9.3
    container_name: ecommerce-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Mount Docker container logs (Linux host). On Docker Desktop, this path may not exist.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - ecommerce-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ecommerce-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - ecommerce-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ecommerce-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Public URL: set GRAFANA_ROOT_URL=https://YOUR_TUNNEL/grafana and use nginx /grafana/
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3002}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - ecommerce-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: ecommerce-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-ecommerce}?sslmode=disable
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    depends_on:
      - postgres
    networks:
      - ecommerce-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    container_name: ecommerce-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    depends_on:
      - redis
    networks:
      - ecommerce-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: ecommerce-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:80/nginx_status
    ports:
      - "${NGINX_EXPORTER_PORT:-9113}:9113"
    depends_on:
      - nginx
    networks:
      - ecommerce-network
    profiles: ["nginx"]

  k6:
    build:
      context: ./monitoring/k6
      dockerfile: Dockerfile
    container_name: ecommerce-k6
    profiles: ["loadtest"]
    environment:
      K6_PROMETHEUS_PORT: ${K6_PROMETHEUS_PORT:-5656}
      K6_BASE_URL: ${K6_BASE_URL:-http://backend:3001}
      K6_FRONTEND_URL: ${K6_FRONTEND_URL:-http://frontend:3000}
      K6_SCRIPT: ${K6_SCRIPT:-/scripts/api-load-test.js}
    volumes:
      - ./monitoring/k6:/scripts:ro
    command:
      - run
      - -o
      - "prometheus=namespace=k6&port=5656"
      - ${K6_SCRIPT:-/scripts/api-load-test.js}
    ports:
      - "${K6_PROMETHEUS_PORT:-5656}:5656"
    depends_on:
      - backend
      - frontend
    networks:
      - ecommerce-network

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
